# The dummy app runs against the database named by ENV["DB"]:
#   DB=sqlite      (default)  storage/test.sqlite3
#   DB=postgresql             tenant_kit_test (libpq env vars / DB_HOST etc.)
#   DB=mysql                  tenant_kit_test via trilogy (DB_HOST, DB_USERNAME, DB_PASSWORD)
<% db = ENV.fetch("DB", "sqlite") %>
default: &default
<% case db when "postgresql" %>
  adapter: postgresql
  encoding: unicode
  host: <%= ENV["DB_HOST"] %>
  port: <%= ENV["DB_PORT"] %>
  username: <%= ENV["DB_USERNAME"] %>
  password: <%= ENV["DB_PASSWORD"] %>
<% when "mysql" %>
  adapter: trilogy
  encoding: utf8mb4
  host: <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DB_PORT", "3306") %>
  username: <%= ENV.fetch("DB_USERNAME", "root") %>
  password: <%= ENV["DB_PASSWORD"] %>
<% else %>
  adapter: sqlite3
  timeout: 5000
<% end %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= db == "sqlite" ? "storage/development.sqlite3" : "tenant_kit_development" %>

test:
  <<: *default
  database: <%= db == "sqlite" ? "storage/test.sqlite3" : "tenant_kit_test" %>

production:
  <<: *default
  database: <%= db == "sqlite" ? "storage/production.sqlite3" : "tenant_kit_production" %>
