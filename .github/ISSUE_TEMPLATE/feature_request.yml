name: Feature request
description: Suggest an improvement
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like TenantKit to do?
  - type: textarea
    id: isolation
    attributes:
      label: Isolation impact
      description: Could this make it easier to cross a tenant boundary? Should it be opt-in?
